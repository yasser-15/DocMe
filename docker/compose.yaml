# DocMe local development stack.
#
# ISOLATION MODEL — the reason this file exists:
#
#   * Every service runs in its own container. Nothing is installed on the host
#     except Docker itself.
#   * All state lives in named Docker volumes, never a host bind mount, so a
#     reset is `docker compose down -v` and your host stays clean.
#   * NO `container_name:` anywhere. Compose auto-generates names scoped to the
#     project, so two clones of this repo can run side by side without
#     colliding.
#   * The volume and network also have NO explicit `name:`, for the same reason.
#     Pinning either to docme_pgdata / docme_default would make them global, and
#     a second copy started with `-p docme-b` would silently share the first
#     copy's database. Compose derives them from the project name instead.
#   * Every published port binds to 127.0.0.1 explicitly. DocMe holds PHI; it
#     must never be reachable from the LAN.
#   * Ports are deliberately non-default (54329, not 5432) so we do not fight a
#     Postgres the developer may already be running. POSTGRES_PORT comes from the
#     env file, so a second copy needs its own env file with a different port.
#   * Credentials come from .env, never from ENV defaults baked into an image.
#
# Running a second, fully isolated copy:
#
#   copy .env .env.b
#   # edit .env.b: COMPOSE_PROJECT_NAME=docme-b and POSTGRES_PORT=54330
#   docker compose --env-file .env.b -f docker/compose.yaml up -d db
#   docker compose --env-file .env.b -f docker/compose.yaml --profile tools run --rm migrate
#
# A different env file is required, not just a different project name: the port
# and COMPOSE_PROJECT_NAME both come from it.
#
# Usage:
#   docker compose -f docker/compose.yaml up -d db
#   docker compose -f docker/compose.yaml run --rm migrate
#   docker compose -f docker/compose.yaml --profile ci build apk-ci

name: docme

services:
  db:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: docme-db:local
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docme}
      POSTGRES_USER: ${POSTGRES_USER:-docme_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Deterministic collation so ORDER BY does not change between machines.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    ports:
      # Loopback only. Never publish to 0.0.0.0.
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -d/-U so it works without a password, and a real query so we know the
      # database (not just the socket) is accepting connections.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docme_app} -d ${POSTGRES_DB:-docme} -q"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    # Host clock skew breaks timestamp defaults and expires certificates.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # One-shot. Applies migrations then exits. Not a long-running service.
  migrate:
    image: docme-db:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: >-
        postgres://${POSTGRES_USER:-docme_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-docme}
      MIGRATIONS_DIR: /migrations
      # Consumed by 0006_app_access.sql, which creates the `docme_client` login
      # role the Flutter app connects as. Kept out of the migration file because
      # migrations are committed and this is a secret.
      DOCME_CLIENT_PASSWORD: ${DOCME_CLIENT_PASSWORD:-}
    volumes:
      # Read-only: a migration run must never be able to edit our source.
      - ../supabase/migrations:/migrations:ro
      - ./migrate.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]
    restart: "no"
    profiles: ["tools"]

  # Interactive psql against the same database. Handy for poking at RLS.
  psql:
    image: docme-db:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: >-
        postgres://${POSTGRES_USER:-docme_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-docme}
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-docme_app}
      PGDATABASE: ${POSTGRES_DB:-docme}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../supabase:/supabase:ro
    entrypoint: ["psql"]
    tty: true
    stdin_open: true
    profiles: ["tools"]

  # RLS verification. Runs supabase/tests/rls_test.sql, which SET ROLEs to a
  # non-superuser — without that the owner bypasses every policy and the suite
  # would pass while proving nothing. Exits non-zero on failure, so CI fails.
  test:
    image: docme-db:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: >-
        postgres://${POSTGRES_USER:-docme_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-docme}
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-docme_app}
      PGDATABASE: ${POSTGRES_DB:-docme}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../supabase:/supabase:ro
    entrypoint:
      - sh
      - -c
      - psql -v ON_ERROR_STOP=1 -f /supabase/tests/rls_test.sql
    restart: "no"
    profiles: ["tools"]

volumes:
  # No `name:` here on purpose. An explicit name makes the volume a global,
  # fixed resource: `docker compose -p docme-b up` would attach the SECOND copy
  # to the SAME pgdata volume, so both copies would read and write one database
  # and `down -v` on either would destroy the other's state. Letting Compose
  # derive the name from the project gives each copy its own volume.
  pgdata:

networks:
  # Same reasoning as pgdata: a fixed network name would let the two copies see
  # each other, and service names like `db` would be ambiguous on that network.
  default: