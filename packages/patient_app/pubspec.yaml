name: patient_app
description: "DocMe — patient health platform. iOS + Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  docme_core:
    path: ../docme_core
  docme_ui:
    path: ../docme_ui
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.0
  geocoding: ^5.0.0
  geolocator: ^14.1.1
  health: ^13.3.2
  intl: ^0.20.3
  liquid_glass_widgets: ^1.8.1
  permission_handler: ^13.0.2
  timezone: ^0.11.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
